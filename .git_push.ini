; ============================================================================
; PickleSphere - Automatic Git Push Configuration
; ============================================================================
; This file contains NO secrets. Credentials are handled by Git itself
; (credential manager, SSH keys, or GIT_ASKPASS) and NEVER stored here.
;
; You can override any setting here with environment variables:
;   GIT_REMOTE_NAME   - remote name            (default: origin)
;   GIT_BRANCH        - branch to push to      (default: main)
;   GIT_AUTO_PUSH     - "true"/"false"         (default: false)
;   GIT_COMMIT_FORMAT - commit message format  (default: {summary})
;   GIT_COMMIT_MESSAGE- a fixed commit message (overrides generation)
;
; For local-only overrides, create .git_push.local.ini in the same format
; (it is git-ignored and takes precedence over this file).

[git]
; Remote name to push to (must exist: `git remote -v`)
remote = origin

; GitHub repository URL (optional, informational).
; Leave empty to use the 'origin' remote URL automatically.
repository_url = https://github.com/kairu15/django-project-picklesphere.git

; Default branch to commit & push to
branch = main

; Set to true to push WITHOUT confirmation (fully automatic mode).
; You can also pass --yes on the command line for one-time auto mode.
; WARNING: auto mode still requires credentials to be available to git.
auto_push = false

; Commit message format. Available placeholders:
;   {type}    - change type: feat / fix / chore / docs / refactor / test
;   {scope}   - top-level module name (e.g. "reservations") or empty
;   {summary} - human-readable summary of what changed
; Example conventional style: {type}({scope}): {summary}
commit_format = {type}: {summary}

; Tag new version before pushing (true/false). See --tag flag for details.
; When true, the script auto-increments the latest tag (vX.Y.Z -> patch bump).
auto_tag = false
