{% extends 'dashboard_base.html' %}
{% load static %}

{% block title %}Send Broadcast{% endblock %}
{% block page_title %}Send Broadcast Message{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
            <div class="card-header bg-transparent border-0 py-3">
                <h5 class="fw-bold mb-0"><i class="fas fa-bullhorn me-2 text-primary"></i>Send Broadcast Message</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" name="title" class="form-control" style="border-radius: 10px;" required placeholder="Enter message title">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Message</label>
                        <textarea name="message" class="form-control" rows="5" style="border-radius: 10px;" required placeholder="Enter your message"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Target Roles</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="target_roles" value="admin" id="role_admin">
                            <label class="form-check-label" for="role_admin">Admin</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="target_roles" value="staff" id="role_staff">
                            <label class="form-check-label" for="role_staff">Staff</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="target_roles" value="player" id="role_player">
                            <label class="form-check-label" for="role_player">Player</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="target_roles" value="member" id="role_member">
                            <label class="form-check-label" for="role_member">Member</label>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" style="border-radius: 10px;">
                            <i class="fas fa-paper-plane me-2"></i>Send Broadcast
                        </button>
                        <a href="{% url 'broadcast_list' %}" class="btn btn-outline-secondary" style="border-radius: 10px;">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
