{% extends 'emails/base_email.html' %}

{% block email_content %}
    <span class="notification-badge {{ notification_type }}">{{ category|title }}</span>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    
    {% if action_url %}
        <div style="text-align: center;">
            <a href="{{ action_url }}" class="cta-button">{{ action_text }}</a>
        </div>
    {% endif %}
{% endblock %}
