{% extends 'emails/base_email.html' %}

{% block email_content %}
    <span class="notification-badge success">🔒 Password Changed</span>
    <h2>Password Changed Successfully</h2>
    <p>Hi <strong>{{ user.get_full_name|default:user.username }}</strong>,</p>
    <p>{{ message }}</p>
    
    <p style="font-size: 14px; color: #888; margin-top: 20px;">
        If you did not make this change, please <a href="{{ site_url }}/contact/" style="color: #3B7A8C;">contact support</a> immediately.
    </p>
    
    <div style="text-align: center;">
        <a href="{{ action_url }}" class="cta-button">{{ action_text }}</a>
    </div>
{% endblock %}
