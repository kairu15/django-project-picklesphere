{% extends 'emails/base_email.html' %}

{% block email_content %}
    <span class="notification-badge warning">📬 New Contact Form Submission</span>
    <h2>New Message from {{ name }}</h2>
    
    <div class="details-card">
        <table cellpadding="0" cellspacing="0">
            <tr>
                <td class="label">Name</td>
                <td class="value">{{ name }}</td>
            </tr>
            <tr>
                <td class="label">Email</td>
                <td class="value">{{ email }}</td>
            </tr>
            <tr>
                <td class="label">Subject</td>
                <td class="value">{{ subject_line }}</td>
            </tr>
            <tr>
                <td class="label">Date</td>
                <td class="value">{% now "F j, Y g:i A" %}</td>
            </tr>
        </table>
    </div>
    
    <h3 style="color: #1a3a42; margin-top: 20px;">Message:</h3>
    <div style="background: #f8fbfa; border: 1px solid #e8f0ee; border-radius: 8px; padding: 16px; margin: 10px 0; white-space: pre-wrap; font-family: sans-serif;">
        {{ message|linebreaks }}
    </div>
{% endblock %}
