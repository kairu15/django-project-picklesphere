{% extends 'base/dashboard_base.html' %}

{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">{{ page_title }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Icon</label>
                            <div class="d-flex align-items-center gap-2">
                                <div class="icon-preview-wrapper" data-icon-preview-for="whyItemIconInput">
                                    <div class="icon-preview-container">
                                        <i class="fas {{ item.icon|default:'fa-check' }}"></i>
                                    </div>
                                    <span class="icon-class-label small text-muted">{{ item.icon|default:'fa-check' }}</span>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm" style="border-radius: 8px;"
                                        onclick="initIconPicker('whyItemIconInput', '{{ item.icon|default:'fa-check' }}')">
                                    <i class="fas fa-icons me-1"></i>Choose
                                </button>
                            </div>
                            <input type="hidden" name="icon" id="whyItemIconInput" value="{{ item.icon|default:'fa-check' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" value="{{ item.title|default:'' }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" required>{{ item.description|default:'' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Color</label>
                            <select name="color" class="form-select">
                                {% for color, label in color_choices %}
                                <option value="{{ color }}" {% if item and item.color == color %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Display Order</label>
                            <input type="number" name="display_order" class="form-control" value="{{ item.display_order|default:0 }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="form-check mt-4">
                                <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if not item or item.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="isActive">Active</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'about_management' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% include 'components/icon_picker.html' %}
{% endblock %}
