{% extends 'base/dashboard_base.html' %}

{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">{{ page_title }}</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="09455470173" readonly required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="picklesphere@gmail.com" readonly required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" required>{{ contact_info.address|default:'123 Sports Avenue, Makati City' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">City/Country</label>
                        <input type="text" name="city_country" class="form-control" value="{{ contact_info.city_country|default:'Metro Manila, Philippines' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Google Maps URL</label>
                        <input type="url" name="google_maps_url" class="form-control" value="{{ contact_info.google_maps_url|default:'' }}" placeholder="https://maps.google.com/...">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'contact_management' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
