{% extends 'base/dashboard_base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="admin-card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label fw-semibold">Tournament</label><select name="tournament" class="form-select" required>{% for t in tournaments %}<option value="{{ t.id }}" {% if featured and featured.tournament.id == t.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Label</label><input type="text" name="label" class="form-control" value="{{ featured.label|default:'' }}"></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Display Order</label><input type="number" name="display_order" class="form-control" value="{{ featured.display_order|default:0 }}"></div>
                    {% if featured %}<div class="mb-3 form-check form-switch"><input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if featured.is_active %}checked{% endif %}><label class="form-check-label" for="isActive">Active</label></div>{% endif %}
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save</button>
                    <a href="{% url 'super_admin_tournaments_cms' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
