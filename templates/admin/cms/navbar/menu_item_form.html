{% extends 'base/dashboard_base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}<i class="fas fa-list me-2"></i>{{ page_title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="admin-card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Title</label>
                            <input type="text" name="title" class="form-control" value="{{ item.title|default:'' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Link Type</label>
                            <select name="link_type" class="form-select">
                                {% for key, val in link_type_choices %}
                                <option value="{{ key }}" {% if item.link_type == key %}selected{% endif %}>{{ val }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Custom URL (if type is Custom)</label>
                            <input type="text" name="custom_url" class="form-control" value="{{ item.custom_url|default:'' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Menu Position</label>
                            <select name="menu_position" class="form-select">
                                <option value="left" {% if item.menu_position == 'left' %}selected{% endif %}>Left (Main Menu)</option>
                                <option value="right" {% if item.menu_position == 'right' %}selected{% endif %}>Right (Actions)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input type="checkbox" name="requires_auth" class="form-check-input" id="reqAuth" {% if item.requires_auth %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="reqAuth">Requires Login</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input type="checkbox" name="hide_if_auth" class="form-check-input" id="hideAuth" {% if item.hide_if_auth %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="hideAuth">Hide When Logged In</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input type="checkbox" name="open_in_new_tab" class="form-check-input" id="newTab" {% if item.open_in_new_tab %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="newTab">Open in New Tab</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Icon Class (Font Awesome)</label>
                            <input type="text" name="icon_class" class="form-control" value="{{ item.icon_class|default:'' }}" placeholder="e.g. fas fa-home">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Display Order</label>
                            <input type="number" name="display_order" class="form-control" value="{{ item.display_order|default:0 }}">
                        </div>
                        {% if item %}
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if item.is_active %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="isActive">Active</label>
                            </div>
                        </div>
                        {% endif %}
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save</button>
                        <a href="{% url 'super_admin_navbar_cms' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
