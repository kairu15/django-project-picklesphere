{% extends 'base/dashboard_base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="admin-card">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">
                        <i class="fas fa-trash-alt fa-2x text-white"></i>
                    </div>
                </div>
                <h4 class="fw-bold mb-2">Are you sure?</h4>
                <p class="text-muted mb-4">This action cannot be undone. This will permanently delete "{{ object }}".</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url cancel_url %}" class="btn btn-outline-secondary btn-lg px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger btn-lg px-4">
                            <i class="fas fa-trash me-2"></i>Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
