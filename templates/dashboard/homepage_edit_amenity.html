{% extends 'dashboard_base.html' %}
{% load static %}

{% block title %}{{ page_title }} - PickleSphere{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg" style="border-radius: 15px;">
                <div class="card-header bg-success text-white" style="border-radius: 15px 15px 0 0;">
                    <h5 class="mb-0"><i class="fas fa-concierge-bell me-2"></i>{{ page_title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Icon Class</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas {{ amenity.icon|default:'fa-check' }}"></i></span>
                                <input type="text" name="icon" class="form-control" 
                                       value="{{ amenity.icon|default:'' }}" required
                                       placeholder="e.g., fa-wifi, fa-car, fa-coffee">
                            </div>
                            <small class="text-muted">
                                Use Font Awesome icon classes. 
                                <a href="https://fontawesome.com/icons" target="_blank">Browse icons</a>
                            </small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Title</label>
                            <input type="text" name="title" class="form-control form-control-lg" 
                                   value="{{ amenity.title|default:'' }}" required 
                                   placeholder="e.g., Free WiFi">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <input type="text" name="description" class="form-control" 
                                   value="{{ amenity.description|default:'' }}" required
                                   placeholder="e.g., High-speed internet throughout">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Display Order</label>
                            <input type="number" name="display_order" class="form-control" 
                                   value="{{ amenity.display_order|default:'0' }}" min="0"
                                   placeholder="Lower numbers appear first">
                            <small class="text-muted">Items will be sorted by this order on the homepage</small>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'homepage_management' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-2"></i>Save Amenity
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
