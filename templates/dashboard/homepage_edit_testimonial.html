{% extends 'dashboard_base.html' %}
{% load static %}

{% block title %}{{ page_title }} - PickleSphere{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg" style="border-radius: 15px;">
                <div class="card-header bg-primary text-white" style="border-radius: 15px 15px 0 0;">
                    <h5 class="mb-0"><i class="fas fa-quote-left me-2"></i>{{ page_title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Name</label>
                            <input type="text" name="name" class="form-control form-control-lg" 
                                   value="{{ testimonial.name|default:'' }}" required 
                                   placeholder="e.g., John Martinez">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Role / Title</label>
                            <input type="text" name="role" class="form-control" 
                                   value="{{ testimonial.role|default:'' }}" required
                                   placeholder="e.g., Regular Member, Tournament Player">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Rating</label>
                            <select name="rating" class="form-select">
                                <option value="5" {% if testimonial.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ (5 Stars)</option>
                                <option value="4" {% if testimonial.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ (4 Stars)</option>
                                <option value="3" {% if testimonial.rating == 3 %}selected{% endif %}>⭐⭐⭐ (3 Stars)</option>
                                <option value="2" {% if testimonial.rating == 2 %}selected{% endif %}>⭐⭐ (2 Stars)</option>
                                <option value="1" {% if testimonial.rating == 1 %}selected{% endif %}>⭐ (1 Star)</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Testimonial Text</label>
                            <textarea name="text" class="form-control" rows="4" required
                                      placeholder="Write the testimonial content here...">{{ testimonial.text|default:'' }}</textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Display Order</label>
                            <input type="number" name="display_order" class="form-control" 
                                   value="{{ testimonial.display_order|default:'0' }}" min="0"
                                   placeholder="Lower numbers appear first">
                            <small class="text-muted">Items will be sorted by this order on the homepage</small>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'homepage_management' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Save Testimonial
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
