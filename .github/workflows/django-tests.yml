name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev 2>/dev/null || echo "mysqlclient-dev not available, skipping"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1 || \
          pip install Django>=4.2,<5.0 Pillow>=10.0.0 python-decouple>=3.8 2>&1

      - name: Run migrations
        run: |
          python manage.py migrate --verbosity=0 2>&1

      - name: Run role access control tests
        run: |
          python manage.py test accounts.tests --verbosity=2

      - name: Run Django system checks
        run: |
          python manage.py check --deploy 2>&1 || echo "Deploy check warnings are acceptable in CI"
